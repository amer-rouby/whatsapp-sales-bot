spring.application.name=salesbot-backend

# Local secrets/overrides (gitignored). Same KEY=value lines as .env.example; missing file is fine.
spring.config.import=optional:file:./.env[.properties]

# Database — namespaced env vars (global DB_URL on this machine belongs to another project)
spring.datasource.url=${SALESBOT_DB_URL:jdbc:postgresql://localhost:5442/salesbot}
spring.datasource.username=${SALESBOT_DB_USERNAME:salesbot}
spring.datasource.password=${SALESBOT_DB_PASSWORD:salesbot}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# WhatsApp Cloud API
salesbot.whatsapp.verify-token=${SALESBOT_WA_VERIFY_TOKEN:local-verify-token}
salesbot.whatsapp.app-secret=${SALESBOT_WA_APP_SECRET:}
salesbot.whatsapp.verify-signature=${SALESBOT_WA_VERIFY_SIGNATURE:true}
salesbot.whatsapp.access-token=${SALESBOT_WA_ACCESS_TOKEN:}
salesbot.whatsapp.api-base-url=https://graph.facebook.com
salesbot.whatsapp.api-version=${SALESBOT_WA_API_VERSION:v25.0}
# cloud = real WhatsApp API, log = print replies to the log (local dev)
salesbot.whatsapp.sender=${SALESBOT_WA_SENDER:log}

# AI reply provider: echo (no key needed) | gemini
salesbot.ai.provider=${SALESBOT_AI_PROVIDER:echo}
salesbot.ai.gemini.api-key=${SALESBOT_GEMINI_API_KEY:}
# Tried in order; on quota (429) or outage (5xx/timeout) the next one answers.
# Free tier is per model (gemini-3-flash-preview: only 20/day, Nov 2026), so the chain multiplies free messages.
# gemini-2.5-flash is closed to new accounts.
salesbot.ai.gemini.models=${SALESBOT_GEMINI_MODELS:gemini-3.6-flash,gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
salesbot.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
salesbot.ai.gemini.timeout=30s
salesbot.ai.gemini.temperature=0.6
# Gemini 3 defaults to "high" thinking, which made replies time out (Nov 2026). Chat needs little reasoning.
salesbot.ai.gemini.thinking-level=${SALESBOT_GEMINI_THINKING_LEVEL:low}
salesbot.ai.gemini.system-prompt=${SALESBOT_GEMINI_SYSTEM_PROMPT:classpath:prompts/sales-assistant-ar.txt}

# Chat with the bot from the dashboard without WhatsApp (dev/demo only, needs sender=log)
salesbot.simulator.enabled=${SALESBOT_SIMULATOR_ENABLED:false}

# Dashboard login. The secret signs session tokens: >= 32 chars, never committed (put it in backend/.env).
salesbot.security.jwt-secret=${SALESBOT_JWT_SECRET:}
salesbot.security.token-ttl=${SALESBOT_TOKEN_TTL:12h}
# true only in development, so the frontend can run `npm run gen:api` without logging in
salesbot.security.expose-api-docs=${SALESBOT_EXPOSE_API_DOCS:false}
# First owner account, created once when there are no users (password >= 10 chars)
salesbot.admin.email=${SALESBOT_ADMIN_EMAIL:}
salesbot.admin.name=${SALESBOT_ADMIN_NAME:}
salesbot.admin.password=${SALESBOT_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info,modulith

# Product photos: the dashboard sends ~150 KB JPEGs; the server refuses anything over 3 MB (413)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
